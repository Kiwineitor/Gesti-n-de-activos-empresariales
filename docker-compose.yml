# ──────────────────────────────────────────────────────────────────────────────
#  ServiceDesk — entorno completo con Docker
#    docker compose up -d --build     → construye y levanta todo
#    http://localhost:9006            → aplicación (usuario: admin / admin123)
#  Ver README.md para más detalles.
# ──────────────────────────────────────────────────────────────────────────────
name: servicedesk

services:

  db:
    image: postgres:16-alpine
    container_name: servicedesk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-servicedesk}
      POSTGRES_USER: ${DB_USER:-servicedesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-servicedesk}
      TZ: America/La_Paz
    ports:
      # Expuesto en el host para conectarse con DBeaver/pgAdmin (opcional)
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ./sistema_sath
    image: servicedesk-app:latest
    container_name: servicedesk-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-servicedesk}
      DB_USER: ${DB_USER:-servicedesk}
      DB_PASSWORD: ${DB_PASSWORD:-servicedesk}
      JWT_SECRET: ${JWT_SECRET:-cambia-esta-clave-secreta-de-al-menos-32-caracteres}
      DEMO_DATA: ${DEMO_DATA:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:9006,http://127.0.0.1:9006,http://localhost:5173}
    ports:
      - "${APP_PORT:-9006}:9006"
    volumes:
      - app-uploads:/app/uploads
      - app-logs:/app/logs

volumes:
  db-data:
  app-uploads:
  app-logs:
