# ----------------------------------------------------------------------------------
#  SERVICEDESK - application.properties
#  Todos los valores sensibles se leen de variables de entorno (ver docker-compose.yml
#  y .env.example). Los valores por defecto sirven para desarrollo local.
# ----------------------------------------------------------------------------------

spring.application.name=servicedesk
server.port=${SERVER_PORT:9006}

# ----------------------------------------------------------------------------------
# BASE DE DATOS
# ----------------------------------------------------------------------------------
spring.datasource.primary.jdbc-url=${DB_URL:jdbc:postgresql://localhost:5432/servicedesk}
spring.datasource.primary.username=${DB_USER:servicedesk}
spring.datasource.primary.password=${DB_PASSWORD:servicedesk}
spring.datasource.primary.driver-class-name=org.postgresql.Driver
spring.datasource.primary.hikari.maximum-pool-size=10
spring.datasource.primary.hikari.minimum-idle=5
spring.datasource.primary.hikari.connection-timeout=30000
spring.datasource.primary.hikari.idle-timeout=600000
spring.datasource.primary.hikari.max-lifetime=1800000
spring.datasource.primary.hikari.keepalive-time=60000

# -- Datos de demostración ---------------------------------------------------------
# true → si la BD está vacía, carga usuarios, catálogos y solicitudes de prueba al arrancar
app.demo-data=${DEMO_DATA:true}

# -- Recursos Estáticos ----------------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# -- CORS ----------------------------------------------------------------------------------
# URLs de los clientes que consumen la API (el frontend en Docker se sirve desde el mismo origen)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:9006,http://127.0.0.1:9006,capacitor://localhost}

# -- Seguridad / JWT ----------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyChangeInProd!}
jwt.expiration=28800000
jwt.refresh-expiration=604800000

# Logs
sath.log.dir=${LOG_DIR:logs}
spring.devtools.restart.exclude=logs/**,Logs/**

# -- WebSockets / STOMP ----------------------------------------------------------------------------------
spring.websocket.enabled=true
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# -- Jackson ------------------------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=${TZ:America/La_Paz}

# -- Almacenamiento de archivos -----------------------------------------------------------------
file.storage.archivos=${FILE_STORAGE_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# -- JPA Performance ----------------------------------------------------------------------------------
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# -- Cache (Caffeine) ----------------------------------------------------------------------------------
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

#debug
#logging.level.org.springframework.security=DEBUG

# -- Solicitud Configuration ----------------------------------------------------------------------------------
# Dígitos de secuencia en el número de solicitud (4 → YYYY0001, 6 → YYYY000001)
solicitud.digitos.secuencia=4
